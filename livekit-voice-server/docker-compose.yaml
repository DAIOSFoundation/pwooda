version: "3.9"

services:
  # LiveKit Server
  livekit:
    image: livekit/livekit-server:v1.6.0
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"      # HTTP API / WebSocket
      - "7881:7881"      # WebRTC over TCP
      - "50000-50100:50000-50100/udp"  # WebRTC UDP (축소된 범위)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  # Redis (LiveKit에서 사용)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  # Token Server (FastAPI)
  token-server:
    build: ./token-server
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - AUTH_SERVER_URL=${AUTH_SERVER_URL:-https://api-llmops.banya.ai}
    depends_on:
      - livekit

  # Voice Agent (Python)
  voice-agent:
    build: ./voice-agent
    restart: unless-stopped
    environment:
      # Docker 내부에서는 서비스 이름으로 접근
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SSE_SERVER_URL=${SSE_SERVER_URL:-https://eu6l8rgf-8083.thundercompute.net/completion-with-tts}
      - SSE_AUTH_TOKEN=${SSE_AUTH_TOKEN}
    depends_on:
      - livekit

  # Twilio Bridge (Phone Call ↔ AI Agent)
  twilio-bridge:
    build: ./twilio-bridge
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+18312733281}
      - TWILIO_WEBHOOK_BASE_URL=${TWILIO_WEBHOOK_BASE_URL}
      - SSE_SERVER_URL=${SSE_SERVER_URL:-https://eu6l8rgf-8083.thundercompute.net/completion-with-tts}
      - SSE_AUTH_TOKEN=${SSE_AUTH_TOKEN}

volumes:
  redis-data:
